[versions]
netty = "4.2.19.Final"
log4j = "2.26.1"

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }

[bundles]
netty = ["netty-codec-compression", "netty-transport", "netty-transport-epoll"]

[libraries]
netty-codec-compression = { group = "io.netty", name = "netty-codec-compression", version.ref = "netty" }
netty-transport = { group = "io.netty", name = "netty-transport", version.ref = "netty" }
netty-transport-epoll = { group = "io.netty", name = "netty-transport-native-epoll", version.ref = "netty" }

log4j-core = { group = "org.apache.logging.log4j", name = "log4j-core", version.ref = "log4j" }

fastutil = "it.unimi.dsi:fastutil-core:8.5.19"

velocity = "com.velocitypowered:velocity-api:4.3.1"